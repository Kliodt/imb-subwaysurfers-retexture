server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # UnityLoader handles the legacy .unityweb compression itself.
    # Do not set Content-Encoding based only on the filename extension.
    location ~ \.unityweb$ {
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
